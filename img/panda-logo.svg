<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241212" />
      <stop offset="80%" stop-color="#0f0707" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Red Dragon Warrior Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b53" />
      <stop offset="50%" stop-color="#c8102e" />
      <stop offset="100%" stop-color="#700413" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe270" />
      <stop offset="100%" stop-color="#d49500" />
    </linearGradient>

    <!-- Fur Shading Gradient -->
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f3efe8" />
      <stop offset="100%" stop-color="#ded7cb" />
    </linearGradient>
  </defs>

  <!-- Outer Badge Circle with Glowing Red Border -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="url(#redGrad)" stroke-width="4" />
  <circle cx="100" cy="100" r="87" fill="none" stroke="rgba(255, 59, 83, 0.35)" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Flaming Wok Curve in Background -->
  <path d="M 42 144 Q 100 178 158 144" fill="none" stroke="url(#redGrad)" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  
  <!-- Crossed Golden Chopsticks Behind Head -->
  <line x1="34" y1="162" x2="166" y2="38" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.45" />
  <line x1="166" y1="162" x2="34" y2="38" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.45" />

  <!-- Panda Ears -->
  <!-- Left Ear -->
  <circle cx="54" cy="56" r="23" fill="#141414" stroke="url(#redGrad)" stroke-width="2.5" />
  <circle cx="56" cy="58" r="14" fill="#262626" opacity="0.8" />
  
  <!-- Right Ear -->
  <circle cx="146" cy="56" r="23" fill="#141414" stroke="url(#redGrad)" stroke-width="2.5" />
  <circle cx="144" cy="58" r="14" fill="#262626" opacity="0.8" />

  <!-- Panda Head (White Fur Base) -->
  <ellipse cx="100" cy="112" rx="56" ry="50" fill="url(#furGrad)" stroke="#161616" stroke-width="2.5" />

  <!-- Panda Black Eye Patches -->
  <ellipse cx="75" cy="108" rx="16" ry="20" fill="#151515" transform="rotate(-18 75 108)" />
  <ellipse cx="125" cy="108" rx="16" ry="20" fill="#151515" transform="rotate(18 125 108)" />

  <!-- Eyes (Determined Warrior Gaze) -->
  <!-- Left Eye -->
  <ellipse cx="76" cy="107" rx="7.5" ry="9" fill="#ffffff" />
  <circle cx="77" cy="107" r="5.2" fill="#2c1507" />
  <circle cx="77" cy="107" r="3.2" fill="#000000" />
  <circle cx="75" cy="104" r="2" fill="#ffffff" />

  <!-- Right Eye -->
  <ellipse cx="124" cy="107" rx="7.5" ry="9" fill="#ffffff" />
  <circle cx="123" cy="107" r="5.2" fill="#2c1507" />
  <circle cx="123" cy="107" r="3.2" fill="#000000" />
  <circle cx="121" cy="104" r="2" fill="#ffffff" />

  <!-- Panda Nose -->
  <path d="M 91 126 C 91 121, 109 121, 109 126 C 109 133, 103 136, 100 136 C 97 136, 91 133, 91 126 Z" fill="#181818" />
  <ellipse cx="97" cy="125" rx="3.5" ry="1.8" fill="#484848" />

  <!-- Confident Warrior Smile / Snout -->
  <path d="M 100 136 L 100 141" stroke="#181818" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 86 139 Q 100 149 114 139" fill="none" stroke="#181818" stroke-width="2.5" stroke-linecap="round" />

  <!-- Martial Arts Red Bandana / Headband -->
  <path d="M 36 76 Q 44 80 54 78 Q 100 68 146 78 Q 156 80 164 76 Q 166 92 148 95 Q 100 84 52 95 Q 34 92 36 76 Z" fill="url(#redGrad)" stroke="#4a030d" stroke-width="1.5" />
  
  <!-- Flowing Ribbon Tails on the Left -->
  <path d="M 38 82 Q 20 90 12 110 Q 22 106 34 94 Z" fill="url(#redGrad)" />
  <path d="M 36 86 Q 16 104 10 126 Q 24 116 36 100 Z" fill="#900b1f" />
  <circle cx="37" cy="86" r="6" fill="#c8102e" stroke="#4a030d" stroke-width="1" />

  <!-- Gold Dragon Emblem in Bandana Center -->
  <circle cx="100" cy="79" r="9.5" fill="#161616" stroke="url(#goldGrad)" stroke-width="1.8" />
  <path d="M 100 73 Q 104 78 101 82 Q 104 80 105 82 Q 100 85 97 81 Q 99 79 97 76 Q 100 77 100 73 Z" fill="url(#goldGrad)" />
</svg>